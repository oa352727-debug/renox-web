name: Build Renox Pterodactyl One-Process ZIP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'telegram-monitor.js'
      - 'bot.js'
      - '.env.example'
      - 'public/index.html'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/build-pterodactyl-zip.yml'
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax and HTML parity
        run: |
          node --check server.js
          node --check telegram-monitor.js
          node --check bot.js
          cmp -s index.html public/index.html
          python3 - <<'PY'
          import re, subprocess, tempfile, pathlib
          html = pathlib.Path('public/index.html').read_text()
          scripts = re.findall(r'<script\\b(?![^>]*\\bsrc=)[^>]*>([\\s\\S]*?)</script\\s*>', html, re.I)
          for script in scripts:
              with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False) as f:
                  f.write(script); name=f.name
              subprocess.run(['node','--check',name],check=True)
          print(f'Checked {len(scripts)} inline scripts.')
          PY
      - name: Prepare Pterodactyl ZIP
        run: |
          mkdir -p renox-pterodactyl/public
          cp server.js bot.js package.json renox-pterodactyl/
          cp .env.example renox-pterodactyl/.env
          cp public/index.html renox-pterodactyl/public/index.html
          cp public/login-anime.jpg renox-pterodactyl/public/login-anime.jpg
          cat > renox-pterodactyl/README-INSTALL.txt <<'EOF'
          RENOX PROJECT + TELEGRAM BOT (ONE PROCESS)

          INSTALL:
          1. Back up data/renox-db.json.
          2. Upload/extract ZIP into the Pterodactyl server root.
          3. Replace server.js, bot.js, package.json, and public/index.html.
          4. Edit .env and fill in your own credentials. Alternatively configure variables in Pterodactyl Startup.
          5. Keep your existing data/renox-db.json unchanged.
          6. Set PORT to the allocation shown in Pterodactyl.
          7. Run npm install, then npm start.

          .ENV VALUES:
          PORT=your_pterodactyl_allocation
          DINONIC_API_KEY=your_dinonic_api_key
          TELEGRAM_BOT_TOKEN=your_botfather_token
          TELEGRAM_CHAT_ID=your_private_chat_or_group_id
          TELEGRAM_ADMIN_IDS=your_numeric_telegram_user_id

          BOT COMMANDS:
          /start /help — bantuan
          /status /stats — statistik server dan user
          /maintenance — status maintenance
          /maintenance_on [reason] — aktifkan maintenance (admin)
          /maintenance_off — nonaktifkan maintenance (admin)
          /announce Title | Content — buat pengumuman Renox (admin)

          Dashboard announcements and maintenance changes are automatically broadcast to Telegram.
          Set TELEGRAM_ADMIN_IDS to trusted numeric Telegram user IDs. Do not share your .env or commit real credentials to GitHub.
          Uptime resets when the Node.js process restarts.
          EOF
          cd renox-pterodactyl
          zip -r ../Renox-Pterodactyl-OneProcess.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Renox-Pterodactyl-OneProcess
          path: Renox-Pterodactyl-OneProcess.zip
          if-no-files-found: error
          retention-days: 7
