name: Build Renox Pterodactyl ZIP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'public/index.html'
      - 'package.json'
      - '.github/workflows/build-pterodactyl-zip.yml'
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Pterodactyl package
        run: |
          mkdir -p renox-pterodactyl/public
          cp server.js package.json renox-pterodactyl/
          cp public/index.html renox-pterodactyl/public/
          cat > renox-pterodactyl/README-INSTALL.txt <<'EOF'
          RENOX PROJECT - PTERODACTYL
          1. Upload/extract this ZIP into your Pterodactyl server root.
          2. Keep your existing data/renox-db.json. Do not overwrite or delete it.
          3. Set PORT to the server's allocated port (currently 2638) in Startup/Variables.
          4. Run npm install, then npm start.
          5. Do not upload .env or secrets to GitHub.
          EOF
          cd renox-pterodactyl
          zip -r ../Renox-Pterodactyl-10.2.1-20261109.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Renox-Pterodactyl-10.2.1
          path: Renox-Pterodactyl-10.2.1-20261109.zip
          if-no-files-found: error
          retention-days: 7
